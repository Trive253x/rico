[package]
name = "ferrocord"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
description = "A lightweight, native alternative Discord client"
default-run = "ferrocord"
license = "MIT"
readme = "README.md"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# DAVE (end-to-end encryption for voice), built on OpenMLS.
davey = "0.2"
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "5"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
iced = { version = "0.13", features = ["tokio", "qr_code", "image", "svg", "advanced"] }
# List of Unicode emojis (names, categories, shortcodes) for the picker.
emojis = "0.6"
# Same version iced uses: decodes animated GIF and WebP frame by frame.
image = { version = "0.24", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# OpenMLS, same versions as davey: only used by the local voice server of the
# demo, which plays Discord's role of MLS external sender.
openmls = "0.8"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
# Official libopus (C, built from source with CMake). Only `audio::codec` uses it,
# so it can be swapped for a pure-Rust codec later.
opus = "0.4"
# Cisco's OpenH264 (C++, built from source): decodes the H.264 video of Go
# Live streams. Only `video::decoder` uses it, on its own thread, with limits.
openh264 = "0.9"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

# Microphone and speakers: for now ferrocord targets Windows only (WASAPI).
# On other systems the voice works without audio devices.
[target.'cfg(windows)'.dependencies]
cpal = "0.18"
# The token goes in the system keychain, never in a plain file.
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

# Linux: kernel keyring (keyutils), no system libraries; it lasts until reboot.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

# In debug builds dependencies are optimised anyway: otherwise generating the
# RSA-2048 key for the QR login takes tens of seconds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
