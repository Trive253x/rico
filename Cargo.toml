[package]
name = "rico"
version = "0.19.0"
edition = "2021"
rust-version = "1.88"
description = "A lightweight, native alternative Discord client"
default-run = "rico"
license = "MIT"
readme = "README.md"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
# Already used by reqwest and iced: shared buffers for file uploads.
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# DAVE (end-to-end encryption for voice), built on OpenMLS.
davey = "0.2"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
iced = { version = "0.14", features = ["tokio", "qr_code", "image", "svg", "advanced"] }
# Light or dark system theme, for the "like the system" theme.
dark-light = "3"
# List of Unicode emojis (names, categories, shortcodes) for the picker.
emojis = "0.9"
# Same version iced uses: decodes animated GIF and WebP frame by frame.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# OpenMLS, same versions as davey: only used by the local voice server of the
# demo, which plays Discord's role of MLS external sender.
openmls = "0.8"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
# Official libopus (C, built from source with CMake). Only `audio::codec` uses it,
# so it can be swapped for a pure-Rust codec later.
opus = "0.4"
# Cisco's OpenH264 (C++, built from source): decodes the H.264 video of Go
# Live streams. Only `video::decoder` uses it, on its own thread, with limits.
openh264 = "0.9"
qrcode = { version = "0.14", default-features = false }
# The system's file dialog for the attach button (Windows: the common item
# dialog; Linux: the XDG portal, no GTK). Approved by the owner with item 3.1
# of docs/todo.md (2026-11-16).
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
rand = "0.8"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
# Updates: the version rules and the signature of the release manifest.
# Both already in Cargo.lock (semver through the build tools, ed25519-dalek
# through DAVE's OpenMLS): no new crate.
semver = "1"
ed25519-dalek = "2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

# Microphone and speakers: for now Rico targets Windows only (WASAPI).
# On other systems the voice works without audio devices.
[target.'cfg(windows)'.dependencies]
cpal = "0.18"
# Go Live: screen and window capture (Windows Graphics Capture) and the sound
# of the streamed program (WASAPI process loopback). Both wrap the system's
# COM/WinRT interfaces with the `windows` crate cpal already uses; only
# `capture::windows` uses them. Approved by the owner (2026-11-10).
windows-capture = "2.0.1"
wasapi = "0.27"
# The token goes in the system keychain, never in a plain file.
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

# Linux: kernel keyring (keyutils), no system libraries; it lasts until reboot.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

# In debug builds dependencies are optimised anyway: otherwise generating the
# RSA-2048 key for the QR login takes tens of seconds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
# Beyond clippy's defaults: the pedantic lints (and a few from the nursery)
# the code follows, checked with the rest by `cargo clippy -- -D warnings`.
assigning_clones = "warn"
cast_lossless = "warn"
default_trait_access = "warn"
doc_markdown = "warn"
elidable_lifetime_names = "warn"
explicit_iter_loop = "warn"
format_collect = "warn"
format_push_string = "warn"
if_not_else = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
items_after_statements = "warn"
manual_assert_eq = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
nonminimal_bool = "warn"
or_fun_call = "warn"
range_plus_one = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
single_char_pattern = "warn"
single_match_else = "warn"
stable_sort_primitive = "warn"
too_long_first_doc_paragraph = "warn"
trivially_copy_pass_by_ref = "warn"
unchecked_time_subtraction = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
use_self = "warn"
