[package]
name = "ferrocord"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Client Discord alternativo, nativo e leggero"
default-run = "ferrocord"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "5"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
iced = { version = "0.13", features = ["tokio", "qr_code", "image", "advanced"] }
# Elenco delle emoji Unicode (nomi, categorie, shortcode) per il selettore.
emojis = "0.6"
# Stessa versione usata da iced: serve per decodificare GIF e WebP animate
# fotogramma per fotogramma.
image = { version = "0.24", default-features = false, features = ["gif", "webp"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

# In debug le dipendenze vengono comunque ottimizzate: la generazione della
# chiave RSA-2048 per il login con QR altrimenti richiede decine di secondi.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
