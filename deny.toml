# Configurazione di cargo-deny (licenze, provenienza e duplicati delle dipendenze).
# Le vulnerabilità sono controllate da cargo-audit nel workflow "Sicurezza".

[graph]
all-features = false

[licenses]
# Licenze accettate per le dipendenze distribuite con l'installer.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[bans]
# Versioni duplicate della stessa libreria: solo un avviso (sono comuni con iced).
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Solo crates.io: niente dipendenze da repository git o registri sconosciuti.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
