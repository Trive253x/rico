<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Rico: a little gardener watering a flower in a pot. Original design. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b414d"/>
      <stop offset="1" stop-color="#282c33"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- ground -->
    <ellipse cx="128" cy="236" rx="150" ry="34" fill="#4f6b45"/>
    <ellipse cx="128" cy="230" rx="150" ry="26" fill="#a1c181" opacity="0.35"/>
  </g>

  <!-- ===== flower in a pot (right) ===== -->
  <!-- stem and leaves -->
  <path d="M190 172 C190 150 186 128 192 104" fill="none" stroke="#7fa65f" stroke-width="7" stroke-linecap="round"/>
  <path d="M190 150 C176 146 168 136 170 126 C182 128 190 138 190 150 Z" fill="#a1c181"/>
  <path d="M191 138 C204 132 214 136 218 144 C206 150 196 148 191 138 Z" fill="#8bb36c"/>
  <!-- flower -->
  <g transform="translate(192 96)">
    <circle cx="0" cy="-17" r="12" fill="#d07277"/>
    <circle cx="16" cy="-5" r="12" fill="#d07277"/>
    <circle cx="10" cy="14" r="12" fill="#d07277"/>
    <circle cx="-10" cy="14" r="12" fill="#d07277"/>
    <circle cx="-16" cy="-5" r="12" fill="#d07277"/>
    <circle cx="0" cy="0" r="10" fill="#dec184"/>
  </g>
  <!-- pot -->
  <path d="M164 176 L216 176 L208 222 L172 222 Z" fill="#c97b4a"/>
  <rect x="158" y="166" width="64" height="16" rx="5" fill="#e0a46f"/>

  <!-- ===== gardener (left) ===== -->
  <!-- legs and boots -->
  <rect x="70" y="196" width="14" height="22" rx="5" fill="#3d5f8f"/>
  <rect x="94" y="196" width="14" height="22" rx="5" fill="#3d5f8f"/>
  <ellipse cx="75" cy="221" rx="12" ry="7" fill="#6b4a33"/>
  <ellipse cx="103" cy="221" rx="12" ry="7" fill="#6b4a33"/>
  <!-- shirt (body) -->
  <rect x="60" y="136" width="58" height="66" rx="22" fill="#a1c181"/>
  <!-- overalls -->
  <path d="M62 168 L116 168 L116 186 Q116 204 98 204 L80 204 Q62 204 62 186 Z" fill="#74ade8"/>
  <rect x="74" y="150" width="30" height="22" rx="4" fill="#74ade8"/>
  <rect x="70" y="140" width="7" height="30" rx="3" fill="#74ade8"/>
  <rect x="101" y="140" width="7" height="30" rx="3" fill="#74ade8"/>
  <circle cx="79" cy="156" r="3" fill="#dec184"/>
  <circle cx="99" cy="156" r="3" fill="#dec184"/>
  <!-- back arm -->
  <path d="M64 150 Q50 168 58 184" fill="none" stroke="#a1c181" stroke-width="12" stroke-linecap="round"/>
  <circle cx="59" cy="186" r="7" fill="#f2c9a0"/>
  <!-- head -->
  <circle cx="89" cy="112" r="28" fill="#f2c9a0"/>
  <circle cx="79" cy="114" r="3.6" fill="#282c33"/>
  <circle cx="99" cy="114" r="3.6" fill="#282c33"/>
  <circle cx="72" cy="123" r="5" fill="#e8a08a" opacity="0.7"/>
  <circle cx="106" cy="123" r="5" fill="#e8a08a" opacity="0.7"/>
  <path d="M82 125 Q89 131 96 125" fill="none" stroke="#282c33" stroke-width="3" stroke-linecap="round"/>
  <!-- straw hat -->
  <ellipse cx="89" cy="94" rx="44" ry="11" fill="#dec184"/>
  <path d="M65 94 Q66 64 89 63 Q112 64 113 94 Z" fill="#e8d09a"/>
  <path d="M66 88 L112 88 L113 94 L65 94 Z" fill="#d07277"/>

  <!-- watering can, held by the front arm -->
  <g transform="rotate(-18 140 160)">
    <rect x="122" y="148" width="34" height="28" rx="6" fill="#9aa3b2"/>
    <path d="M156 156 L184 140 L187 146 L158 166 Z" fill="#9aa3b2"/>
    <rect x="182" y="134" width="9" height="16" rx="3" transform="rotate(-30 186 142)" fill="#b8c0cc"/>
    <path d="M130 148 Q139 132 148 148" fill="none" stroke="#9aa3b2" stroke-width="5"/>
  </g>
  <!-- front arm -->
  <path d="M110 150 Q124 152 130 158" fill="none" stroke="#a1c181" stroke-width="12" stroke-linecap="round"/>
  <circle cx="132" cy="160" r="7" fill="#f2c9a0"/>
  <!-- water drops -->
  <g fill="#74ade8">
    <path d="M196 132 q4 6 0 9 q-4 -3 0 -9 Z"/>
    <path d="M206 140 q4 6 0 9 q-4 -3 0 -9 Z"/>
    <path d="M186 140 q4 6 0 9 q-4 -3 0 -9 Z"/>
  </g>
</svg>
